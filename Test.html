<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f3ee;
            --ink: #1a1a1a;
            --muted: #8a8780;
            --accent: #c8553d;
            --line: #d8d4cb;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Fraunces', Georgia, serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 4rem;
            overflow: hidden;
            position: relative;
        }

        /* subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
            opacity: 0.06;
            pointer-events: none;
            z-index: 1;
        }

        header, main, footer {
            position: relative;
            z-index: 2;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            animation: fadeIn 1s ease-out 0.2s forwards;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .mark::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2.5s ease-in-out infinite;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            max-width: 900px;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 2rem;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.6s forwards;
        }

        .eyebrow span {
            display: inline-block;
            width: 32px;
            height: 1px;
            background: var(--muted);
            vertical-align: middle;
            margin-right: 1rem;
        }

        h1 {
            font-size: clamp(3.5rem, 9vw, 8rem);
            font-weight: 300;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
            font-variation-settings: "opsz" 144;
        }

        h1 .word {
            display: inline-block;
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 .word:nth-child(1) { animation-delay: 0.8s; }
        h1 .word:nth-child(2) { animation-delay: 1.0s; }

        h1 em {
            font-style: italic;
            color: var(--accent);
            font-weight: 300;
        }

        .lede {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--muted);
            max-width: 480px;
            font-weight: 400;
            opacity: 0;
            animation: slideUp 0.8s ease-out 1.4s forwards;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            animation: fadeIn 1s ease-out 1.6s forwards;
        }

        footer .meta {
            display: flex;
            gap: 2rem;
        }

        .index {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 1rem;
            text-transform: none;
            letter-spacing: 0;
            color: var(--ink);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        @media (max-width: 640px) {
            body {
                padding: 2rem 1.5rem;
            }
            header, footer {
                font-size: 0.65rem;
            }
            footer .meta {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="mark">Online</div>
        <div>2026 — Edition №01</div>
    </header>

    <main>
        <div class="eyebrow"><span></span>A new beginning</div>
        <h1>
            <span class="word">Hello,&nbsp;</span><span class="word"><em>world.</em></span>
        </h1>
        <p class="lede">
            ยินดีต้อนรับสู่มุมเล็กๆ ของฉันบนอินเทอร์เน็ต
            ที่ที่ความคิด งานสร้างสรรค์ และเรื่องราวต่างๆ จะค่อยๆ ก่อตัวขึ้น
        </p>
    </main>

    <footer>
        <div class="meta">
            <span>Made with care</span>
            <span>Bangkok</span>
        </div>
        <div class="index">— first page</div>
    </footer>
</body>
</html>
